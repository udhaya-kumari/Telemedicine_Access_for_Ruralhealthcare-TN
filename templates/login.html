{% extends 'base.html' %}
{% block title %}Login · TeleMed Tamil Nadu{% endblock %}
{% block content %}
<div class="container" style="max-width: 460px;">
  <div class="card shadow-sm border-0 mt-4">
    <div class="card-body p-4">
      <h1 class="h4 fw-bold mb-3 text-center" data-i18n="login_title">Login to your account</h1>
      <div id="loginAlert" class="alert alert-danger d-none" role="alert"></div>
      <form id="loginForm" novalidate data-endpoint="{{ url_for('auth.login') }}" action="{{ url_for('auth.login') }}" method="post">
        <div class="mb-3">
          <label class="form-label" data-i18n="login_email">Email</label>
          <input type="email" name="email" class="form-control form-control-lg" required>
        </div>
        <div class="mb-3">
          <label class="form-label" data-i18n="login_password">Password</label>
          <input type="password" name="password" class="form-control form-control-lg" required>
        </div>
        <button type="submit" class="btn btn-teal btn-lg w-100" data-i18n="login_submit">Sign in</button>
      </form>
    <p>
    Don't have an account?
    <a href="/register">Register</a>
</p> 
    </div>
  </div>
</div>
{% endblock %}
